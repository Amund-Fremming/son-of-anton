services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - zigbee

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt/data:/app/data
    ports:
      - "8080:8080"
    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_1CDBD45F1ED4-if00:/dev/ttyACM0
    environment:
      - TZ=Europe/Oslo
    depends_on:
      - mosquitto
    networks:
      - zigbee

networks:
  zigbee:
    driver: bridge

