<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <div class="button-grid">
            <button id="off" class="btn btn-light">
                All off
            </button>
            <button id="on" class="btn btn-light">
                All on
            </button>
            <button id="movie" class="btn btn-light">
                Movie mode
            </button>
            <button id="party" class="btn btn-light">
                Party mode
            </button>
            <button id="night" class="btn btn-light">
                Night mode
            </button>
        </div>
        <a href="#" id="logs-link" class="logs-link-box">
            📋 View System Logs
        </a>
    </div>
    <script src="/script.js"></script>
</body>

</html>
